<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incursion Red River — Terminal Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --sidebar: #0a0a0a;
    --panel: #101010;
    --panel2: #161616;
    --hover: #1a1a18;
    --border: rgba(232, 228, 216, 0.28);
    --border-strong: rgba(232, 228, 216, 0.55);
    --text: #e8e4d8;
    --dim: #9a9588;
    --faint: #706b5e;
    --accent: #c9b87a;
    --accent-text: #14110a;
    --attention: #d89c56;
    --changed: #c9b87a;
    --danger: #d47868;
    --ok: #8fbf7f;
    --font-ui: "Barlow Condensed", "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body { margin: 0; font-family: var(--font-mono); background: var(--bg); color: var(--text); font-size: 13px; overflow: hidden; }
  ::placeholder { color: var(--faint); opacity: 1; }

  /* ---- header ---- */
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 53px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-family: var(--font-ui); font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 2px; text-transform: uppercase; }
  header h1 small { color: var(--dim); font-size: 12px; letter-spacing: 3px; margin-left: 10px; }
  header .spacer { flex: 1; }
  header input#token { width: 250px; }

  /* ---- generic controls ---- */
  input[type=text], input[type=number], input[type=password], textarea, select {
    background: #0a0a0a; color: var(--text); border: 1px solid var(--border); border-radius: 0;
    padding: 7px 10px; font-size: 12.5px; font-family: var(--font-mono); width: 100%;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  input[readonly], textarea[readonly] { color: var(--dim); background: transparent; cursor: default; }
  input.invalid, select.invalid { border-color: var(--danger); }
  textarea { min-height: 70px; resize: vertical; line-height: 1.5; }
  textarea.tall { min-height: 140px; }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
  button {
    background: #0a0a0a; color: var(--text); border: 1px solid var(--border-strong); border-radius: 0;
    padding: 7px 14px; font-size: 12px; cursor: pointer; font-family: var(--font-ui);
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; white-space: nowrap;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary {
    clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
  }
  button.ghost { background: transparent; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.small { padding: 4px 10px; font-size: 11px; }
  button.icon { padding: 1px 6px; font-size: 12px; font-family: var(--font-mono); letter-spacing: 0; border-color: var(--border); background: transparent; color: var(--dim); }
  button.icon:hover { color: var(--accent); border-color: var(--accent); }
  button.icon.danger:hover { color: var(--danger); border-color: var(--danger); }
  label { display: block; font-size: 11px; color: var(--dim); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1.5px; font-family: var(--font-ui); font-weight: 600; }
  label.chk { display: flex; gap: 8px; align-items: center; cursor: pointer; }
  small.hint, .hint { color: var(--faint); font-family: var(--font-mono); letter-spacing: 0; text-transform: none; font-weight: 400; font-size: 11px; }
  .note { color: var(--faint); font-size: 11px; margin-top: 3px; line-height: 1.5; }
  .note.ok { color: var(--ok); }
  .note.warn { color: var(--attention); }
  .note.err { color: var(--danger); }
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 17px; height: 16px; padding: 0 5px; font-size: 10.5px; font-weight: 600; font-family: var(--font-mono); border: 1px solid var(--border); }
  .badge.attn { color: var(--attention); border-color: var(--attention); }
  .badge.err { color: var(--danger); border-color: var(--danger); }
  .badge.chg { color: var(--accent); border-color: var(--accent); }
  .badge.new { color: var(--ok); border-color: var(--ok); }
  code { font-family: var(--font-mono); color: var(--accent); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a.chip:hover { text-decoration: none; border-color: var(--accent); color: var(--accent); }

  /* ---- layout ---- */
  main { display: flex; height: calc(100vh - 53px); }
  #sidebar { width: 210px; flex-shrink: 0; background: var(--sidebar); border-right: 1px solid var(--border); overflow-y: auto; padding: 10px; }
  #content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #panel { width: 460px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--border); display: none; flex-direction: column; }
  #panel.open { display: flex; }

  /* ---- sidebar ---- */
  .side-h { font-family: var(--font-ui); font-size: 11px; color: var(--faint); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; margin: 14px 6px 6px; }
  .side-item {
    display: flex; align-items: center; gap: 6px; padding: 5px 9px; cursor: pointer; color: var(--dim);
    font-family: var(--font-ui); font-weight: 600; font-size: 14px; letter-spacing: 1px; text-transform: uppercase;
    border: 1px solid transparent; margin-bottom: 1px;
  }
  .side-item:hover { color: var(--text); border-color: var(--border); }
  .side-item.active { color: var(--accent); background: var(--panel2); border: 1px solid var(--border); }
  .side-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #newTerminalBtn { width: 100%; margin-top: 10px; }

  /* ---- content toolbar ---- */
  #toolbar { padding: 12px 16px 0; border-bottom: 1px solid var(--border); background: var(--bg); }
  #termHead { display: flex; align-items: baseline; gap: 12px; }
  #termHead .nm { font-family: var(--font-ui); font-size: 20px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
  #termHead .path { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #ttabs { display: flex; margin-top: 10px; border: 1px solid var(--border-strong); border-bottom: none; }
  .tab {
    flex: 1; text-align: center; padding: 7px 10px; cursor: pointer; color: var(--dim);
    font-family: var(--font-ui); font-weight: 600; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; gap: 6px; align-items: center; justify-content: center; border-bottom: 1px solid var(--border-strong);
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent-text); background: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge { height: 14px; font-size: 9.5px; }
  .tab.active .badge { color: var(--accent-text); border-color: var(--accent-text); }
  #subbar { display: flex; gap: 8px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); }
  #subbar:empty { display: none; }
  #subbar input[type=text] { flex: 1; min-width: 120px; }
  #problems { border-bottom: 1px solid var(--border); background: rgba(80, 52, 22, 0.12); max-height: 150px; overflow-y: auto; }
  #problems:empty { display: none; }
  .prob { padding: 4px 16px; font-size: 11.5px; cursor: pointer; display: flex; gap: 8px; }
  .prob:hover { background: var(--hover); }
  .prob .lvl { font-family: var(--font-ui); font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; width: 54px; flex-shrink: 0; }
  .prob.error .lvl { color: var(--danger); }
  .prob.warn .lvl { color: var(--attention); }

  #mainWrap { flex: 1; overflow-y: auto; }
  .empty { color: var(--dim); padding: 40px 20px; line-height: 1.7; text-align: center; }

  /* ---- lists ---- */
  table.list { width: 100%; border-collapse: collapse; }
  table.list th {
    position: sticky; top: 0; background: var(--bg); z-index: 1; text-align: left;
    font-family: var(--font-ui); font-size: 11px; color: var(--faint); letter-spacing: 2px; text-transform: uppercase; font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--border-strong);
  }
  table.list td { padding: 6px 10px; border-bottom: 1px dashed var(--border); vertical-align: middle; }
  table.list tr.row { cursor: pointer; }
  table.list tr.row:hover td { background: var(--hover); }
  table.list tr.row.active td { background: var(--panel2); }
  td.dim { color: var(--dim); }
  td.faint { color: var(--faint); font-size: 11px; }
  .nmc { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 1px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-family: var(--font-ui); font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; padding: 1px 7px; border: 1px solid var(--border); color: var(--dim); white-space: nowrap; }
  .chip.acc { color: var(--accent); border-color: var(--accent); }
  .chip.attn { color: var(--attention); border-color: var(--attention); }
  .chip.err { color: var(--danger); border-color: var(--danger); }

  /* file tree */
  .tree-row { display: flex; align-items: center; gap: 8px; padding: 5px 16px; border-bottom: 1px dashed var(--border); cursor: pointer; min-height: 32px; }
  .tree-row:hover { background: var(--hover); }
  .tree-row.active { background: var(--panel2); }
  .tree-row .tw { width: 14px; color: var(--faint); flex-shrink: 0; text-align: center; }
  .tree-row .ic { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: 1px; width: 34px; flex-shrink: 0; color: var(--faint); border: 1px solid var(--border); text-align: center; }
  .tree-row.dir .ic { color: var(--accent); border-color: var(--accent); }
  .tree-row .nm { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 1px; }
  .tree-row.file .nm { font-family: var(--font-mono); font-weight: 500; font-size: 12.5px; letter-spacing: 0; }
  .tree-row .grow { flex: 1; }
  .tree-row.detached .nm { color: var(--danger); }

  /* ---- detail panel ---- */
  #panelHead { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
  #panelHead .top { display: flex; align-items: flex-start; gap: 12px; }
  #panelHead .kind { color: var(--faint); font-family: var(--font-ui); font-size: 12px; letter-spacing: 2px; text-transform: uppercase; }
  #panelHead .nm { font-family: var(--font-ui); font-size: 19px; font-weight: 600; letter-spacing: 1.5px; line-height: 1.15; word-break: break-all; }
  #panelHead .close { margin-left: auto; cursor: pointer; color: var(--dim); font-size: 15px; padding: 2px 7px; border: 1px solid transparent; }
  #panelHead .close:hover { color: var(--text); border-color: var(--border); }
  #panelBody { flex: 1; overflow-y: auto; padding: 4px 16px 16px; }
  #panelFoot { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; background: var(--panel); }
  #panelFoot:empty { display: none; }
  #panelFoot .spacer { flex: 1; }
  .sec { font-family: var(--font-ui); font-size: 12px; color: var(--faint); letter-spacing: 2.5px; text-transform: uppercase; font-weight: 600; margin: 18px 0 2px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; min-width: 0; }
  .field.disabled { opacity: .45; pointer-events: none; }
  details.adv { margin-top: 12px; }
  details.adv > summary { cursor: pointer; color: var(--faint); font-family: var(--font-ui); font-size: 11px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600; }

  /* nested values */
  .card { border: 1px solid var(--border); background: rgba(255, 255, 255, 0.015); margin-top: 6px; }
  .card > .card-h { display: flex; gap: 6px; align-items: center; padding: 5px 7px; background: var(--panel2); border-bottom: 1px solid transparent; }
  .card.open > .card-h { border-bottom-color: var(--border); }
  .card > .card-h select { padding: 4px 6px; font-size: 11.5px; width: auto; min-width: 0; flex: 1; }
  .card > .card-h .tg { cursor: pointer; color: var(--faint); width: 14px; text-align: center; flex-shrink: 0; user-select: none; }
  .card > .card-h .ttl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .card > .card-h .pv { color: var(--faint); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1.4; min-width: 0; }
  .card > .card-b { padding: 0 10px 10px; }
  .card > .card-b > .field:first-child > label, .card > .card-b > label.chk:first-child { margin-top: 8px; }
  .card.none > .card-h select { color: var(--faint); }
  .arr { border-left: 1px solid var(--border); padding-left: 8px; }
  .arr-row { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
  .arr-row > .grow { flex: 1; min-width: 0; }
  .arr-add { display: flex; gap: 6px; margin-top: 6px; }
  .arr-add select { width: auto; padding: 4px 6px; font-size: 11.5px; }
  .tools { display: flex; gap: 3px; flex-shrink: 0; }
  .mapkey { flex: 1; }
  .mapkey input { padding: 4px 6px; font-size: 11.5px; }
  .raw { white-space: pre-wrap; font-size: 11px; color: var(--dim); max-height: 160px; overflow: auto; background: #0a0a0a; border: 1px dashed var(--border); padding: 6px; }

  /* settings + history + console */
  .pagebody { max-width: 760px; padding: 4px 22px 30px; }
  .hist { border-left: 1px solid var(--border-strong); margin: 16px 0 0 22px; padding-left: 14px; }
  .hist-e { margin-bottom: 14px; }
  .hist-e .when { color: var(--faint); font-size: 11px; }
  .hist-e .who { color: var(--dim); font-weight: 600; font-size: 11px; }
  .hist-e .lines { margin-top: 3px; font-size: 11.5px; line-height: 1.6; }
  #console { display: flex; height: 100%; }
  #conOut { flex: 1; overflow-y: auto; padding: 14px 18px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; background: #070707; }
  #conOut .echo { color: var(--accent); }
  #conOut .sys { color: var(--faint); }
  #conOut .evt { color: var(--attention); font-size: 11.5px; }
  #conOut .err { color: var(--danger); }
  #conSide { width: 260px; border-left: 1px solid var(--border); padding: 4px 14px; overflow-y: auto; }
  #conLine { display: flex; border-top: 1px solid var(--border); background: #070707; }
  #conLine .pr { padding: 8px 0 8px 18px; color: var(--accent); white-space: nowrap; }
  #conLine input { border: none; background: transparent; }
  .conwrap { display: flex; flex-direction: column; flex: 1; min-width: 0; }

  /* ---- overlay ---- */
  #overlay { position: fixed; inset: 0; background: rgba(5, 5, 4, 0.75); display: none; z-index: 20; }
  #overlay.open { display: flex; align-items: center; justify-content: center; }
  #overlayCard { width: 680px; max-height: 82vh; background: var(--panel); border: 1px solid var(--border-strong); display: flex; flex-direction: column; }
  #overlayCard .oh { display: flex; align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--border); font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; }
  #overlayCard .oh .close { margin-left: auto; cursor: pointer; color: var(--dim); padding: 2px 8px; }
  #overlayCard .oh .close:hover { color: var(--text); }
  #overlayBody { flex: 1; overflow-y: auto; padding: 12px 18px; }
  #overlayFoot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }
  #overlayFoot .spacer { flex: 1; }
  .diff-item { margin-bottom: 10px; border: 1px dashed var(--border); padding: 9px 12px; background: var(--panel2); }
  .diff-item .dname { font-family: var(--font-ui); font-weight: 600; font-size: 15px; letter-spacing: 1px; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  .diff-item .dname .spacer { flex: 1; }
  .diff-item .dline { font-size: 12px; margin-top: 3px; word-break: break-word; }
  .diff-item .dpath { color: var(--dim); }
  .diff-item .old { color: var(--danger); }
  .diff-item .new { color: var(--changed); }

  #status {
    position: fixed; bottom: 16px; right: 16px; padding: 10px 16px;
    background: var(--panel2); border: 1px solid var(--border); display: none;
    max-width: 460px; font-size: 12px; white-space: pre-wrap; z-index: 30;
  }
  #status.ok { border-color: var(--accent); }
  #status.err { border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>Terminal Editor<small>Incursion Red River</small></h1>
  <div class="spacer"></div>
  <button id="validateBtn">Validate all</button>
  <button id="changesBtn">Changes <span class="badge chg" id="changesBadge">0</span></button>
  <input type="password" id="token" placeholder="GitHub token" title="Personal access token with read/write Contents on this repo. Stored only in this browser.">
  <button id="saveToken" class="ghost">Remember</button>
</header>
<main>
  <div id="sidebar">
    <div class="side-h">Terminals</div>
    <div id="termList"></div>
    <button id="newTerminalBtn" class="ghost small">+ New terminal</button>
  </div>

  <div id="content">
    <div id="toolbar">
      <div id="termHead"></div>
      <div id="ttabs"></div>
    </div>
    <div id="subbar"></div>
    <div id="problems"></div>
    <div id="mainWrap"></div>
  </div>

  <div id="panel">
    <div id="panelHead"></div>
    <div id="panelBody"></div>
    <div id="panelFoot"></div>
  </div>
</main>

<div id="overlay">
  <div id="overlayCard">
    <div class="oh"><span id="overlayTitle"></span><span class="close" id="overlayClose">✕</span></div>
    <div id="overlayBody"></div>
    <div id="overlayFoot"></div>
  </div>
</div>
<div id="status"></div>

<script src="editor.js"></script>
</body>
</html>
